id: web-guide
status: draft
core_release: v0.1.0

product:
  type: web page
  format: self-contained HTML, published with GitHub Pages
  length: the complete core document
  presentation_time: null
  template: process/templates/guide (AIRA Web theme)

audience:
  name: Participants in InteropHub topic 7 and related topics
  assumed_knowledge:
    - Familiar with immunization information systems and immunization CDS

purpose: >-
  Publish the Topic Reference: one readable, linkable copy of the current
  concept to refer to in discussions, with a way to comment on it during and
  between meetings.

desired_outcome: >-
  Readers can find any section quickly, see the document's status, and leave
  comments that are brought back to this repository as review inputs.

emphasize:
  - The DRAFT status and version
  - A route back to InteropHub topic 7

exclude_or_deemphasize:
  - Repository build and maintenance detail

tone:
  - Plain language

allowed_sources:
  - ../../content/

required_elements:
  - Status tag and version on the page
  - Return link to InteropHub topic 7
  - Comments that stay in the reader's browser until downloaded

published_locations:
  latest_release: https://immregistries.github.io/contextual-conditions/latest/
  each_release: https://immregistries.github.io/contextual-conditions/<version>/
  main_branch: https://immregistries.github.io/contextual-conditions/main/

assumptions: []
delivery_context: []
requested_by: null
requested_date: null
needed_by: null
